spring.application.name=cardapio

# Render define PORT automaticamente
server.port=${PORT:8080}

# Database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false

# Logging otimizado para produção
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.seu.pacote=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{20} - %msg%n

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
api.security.token.secret=${DATABASE_SECRET}

# Performance otimizada para Render
spring.main.lazy-initialization=true
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=10

# Static resources (Vite)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# SPA support (importante para React/Vue)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# JPA otimizado
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true